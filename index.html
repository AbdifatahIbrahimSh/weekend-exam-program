/* SETTINGS */
V.settings=()=>head('Settings','College profile and grading')+`<form class="card" style="max-width:640px" onsubmit="setSave(event)"><label>College name<input name="name" value="${esc(db.set.name)}" required></label><div class="grid"><label>Currency symbol<input name="cur" value="${esc(db.set.cur)}" required></label><label>Pass mark (%)<input type="number" name="pass" min="1" max="100" value="${db.set.pass}" required></label></div><b>Grade thresholds (minimum %)</b><div class="grid">${mp(db.set.scale.slice(0,-1),(g,i)=>`<label>Grade ${g[1]}<input type="number" name="g${i}" min="1" max="100" value="${g[0]}" required></label>`)}</div><div class="row sp"><button type="button" class="btn dg" onclick="ask('Reset all data to the demo set?',()=>{db=seed();save();location.hash='';go();toast('Demo data restored')})">Reset demo data</button><button class="btn pri">Save settings</button></div></form>`;
function setSave(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.set.name=d.name;db.set.cur=d.cur;db.set.pass=+d.pass;db.set.scale.slice(0,-1).forEach((g,i)=>g[0]=+d['g'+i]);log('Updated settings');save();go(1);toast('Settings saved')}
toggleTh(ls.g('wsd_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));$('main').onclick=()=>$('sb').classList.remove('open');const au=ls.g('wsd_auth');if(USERS[au]){db.role=USERS[au][1];go()}else showLogin();
</script></body></html>
